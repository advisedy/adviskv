syntax = "proto3";

package adviskv.meta.rpc;

import "common.proto";

message CreateDBRequest {
  string db_name = 1;
  string zone = 2;
}

message CreateDBResponse {
  adviskv.pb.BaseRsp base_rsp = 1;
  int32 db_id = 2;
}

message DropDBRequest {
  string db_name = 1;
}

message DropDBResponse {
  adviskv.pb.BaseRsp base_rsp = 1;
  int32 db_id = 2;
}

message CreateTableRequest {
  string db_name = 1;
  string table_name = 2;
  int32 shard_count = 3;
  int32 replica_count = 4;
  string resource_pool = 5;
  adviskv.pb.EngineType engine_type = 6;
}

message CreateTableResponse {
  adviskv.pb.BaseRsp base_rsp = 1;
  int32 table_id = 2;
  adviskv.pb.TablePhase phase = 3;
  string operation_id = 4;
}

message DropTableRequest {
  string db_name = 1;
  string table_name = 2;
}

message DropTableResponse {
  adviskv.pb.BaseRsp base_rsp = 1;
  int32 table_id = 2;
  adviskv.pb.TablePhase phase = 3;
  string operation_id = 4;
}

message AlterTableReplicaCountRequest {
  string db_name = 1;
  string table_name = 2;
  int32 replica_count = 3;
}

message AlterTableReplicaCountResponse {
  adviskv.pb.BaseRsp base_rsp = 1;
  int32 table_id = 2;
  adviskv.pb.TablePhase phase = 3;
  string operation_id = 4;
}

message GetTableRequest {
  string db_name = 1;
  string table_name = 2;
  bool use_table_id = 3;
  int32 table_id = 4;
}

message GetTableResponse {
  adviskv.pb.BaseRsp base_rsp = 1;
  int32 db_id = 2;
  int32 table_id = 3;
  int32 shard_count = 4;
  int32 replica_count = 5;
  adviskv.pb.TablePhase phase = 6;
  string last_error_msg = 7;
  string operation_id = 8;
  adviskv.pb.EngineType engine_type = 9;
}

message RouteReplica {
    adviskv.pb.Endpoint endpoint = 1;
    adviskv.pb.RaftRole role = 2;
    adviskv.pb.ReplicaID replica_id = 3;
}

message HashRange {
    uint32 start = 1;
    uint32 end = 2;
}

message ShardRoute {
    int32 shard_id = 1;
    repeated RouteReplica replicas = 2;
    HashRange hash_range = 3;
}

message GetTableRoutesRequest{
    string db_name = 1;
    string table_name = 2;
    bool include_unavailable = 3;
}

message GetTableRoutesResponse{
    adviskv.pb.BaseRsp base_rsp = 1;
    int32 table_id = 2;
    int32 shard_count = 3;
    repeated ShardRoute routes = 4;
}

message RegisterNodeRequest{
    string node_id = 1;
    string ip = 2;
    int32 port = 3;
    string resource_pool = 4;
    string dc = 5;
}

message RegisterNodeResponse{
    adviskv.pb.BaseRsp base_rsp = 1;
}

message HeartbeatReplicaInfo{
    adviskv.pb.ReplicaID replica_id = 1;
    adviskv.pb.RaftRole role = 2;
    adviskv.pb.StorageReplicaStatus status = 3;
    int64 term = 4;
    adviskv.pb.RaftMemberType member_type = 5;
    repeated adviskv.pb.RaftMember full_membership = 6;
}

message HeartbeatRequest{
    string node_id = 1;
    string ip = 2;
    int32 port = 3;
    string resource_pool = 4;
    string dc = 5;
    repeated HeartbeatReplicaInfo replica_info_list = 6;
}

enum ExpectedReplicaType {
    PRESENT = 0;
    ABSENT = 1;
    ADD_MEMBER = 2;
    REMOVE_MEMBER = 3;
}

message ExpectedReplica {
    ExpectedReplicaType type = 1;
    adviskv.pb.ReplicaID replica_id = 2;
    adviskv.pb.EngineType engine_type = 3;
    repeated adviskv.pb.PeerMember initial_members = 4;
}

message HeartbeatResponse{
    adviskv.pb.BaseRsp base_rsp = 1;
    repeated ExpectedReplica expects = 2;
}

service MetaService {
  rpc CreateDB(CreateDBRequest) returns (CreateDBResponse);
  rpc DropDB(DropDBRequest) returns (DropDBResponse);
  rpc CreateTable(CreateTableRequest) returns (CreateTableResponse);
  rpc DropTable(DropTableRequest) returns (DropTableResponse);
  rpc AlterTableReplicaCount(AlterTableReplicaCountRequest) returns (AlterTableReplicaCountResponse);
  rpc GetTable(GetTableRequest) returns (GetTableResponse);
  rpc GetTableRoutes(GetTableRoutesRequest) returns (GetTableRoutesResponse);
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}
