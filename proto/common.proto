syntax = "proto3";

package adviskv.pb;

message BaseRsp {
    int32 code = 1;
    string msg = 2;
}

message NodeInfo {
  string node_name = 1;
  string host = 2;
  int32 port = 3;
  int32 status = 4;  // adviskv::meta::NodeStatus
}

message ReplicaInfo {
  int32 table_id = 1;
  int32 shard_id = 2;
  int32 replica_seq = 3;
  string node_id = 4;
  int32 role = 5;      // adviskv::ReplicaRole
  int32 status = 6;    // adviskv::StorageReplicaStatus
  Endpoint endpoint = 7;
  int64 term = 8;
}

message ReplicaID {
  int32 table_id = 1;
  int32 shard_index = 2;
  int32 replica_seq = 3;
}

message Endpoint {
  string ip = 1;
  int32 port = 2;
}

message PeerMember {
  adviskv.pb.ReplicaID replica_id = 1;
  string node_id = 2;
  adviskv.pb.Endpoint endpoint = 3;
}

message RaftMember {
  adviskv.pb.PeerMember peer = 1;
  int32 member_type = 2;  // adviskv::RaftMemberType
}

message RouteReplica {
    adviskv.pb.Endpoint endpoint = 1;
    int32 role = 2;  // adviskv::ReplicaRole
    adviskv.pb.ReplicaID replica_id = 3;
}

message HashRange {
    uint32 start = 1;
    uint32 end = 2;
}

message ShardRoute {
    int32 shard_id = 1;
    repeated RouteReplica replicas = 2;
    HashRange hash_range = 3;
}

message HeartbeatReplicaInfo{
    adviskv.pb.ReplicaID replica_id = 1;
    int32 role = 2;        // adviskv::ReplicaRole
    int32 status = 3;      // adviskv::StorageReplicaStatus
    int64 term = 4;
    int32 member_type = 5; // adviskv::RaftMemberType
    repeated adviskv.pb.RaftMember full_membership = 6;
}

message ExpectedReplica {
    int32 type = 1;  // adviskv::ExpectedReplicaType
    adviskv.pb.ReplicaID replica_id = 2;
    int32 engine_type = 3;  // adviskv::EngineType
    repeated adviskv.pb.PeerMember initial_members = 4;
}

message LogEntry{
  int64 term = 1;
  int64 index = 2;
  int32 op_type = 3;
  string key = 4;
  string value = 5;
  adviskv.pb.PeerMember config_member = 6;
  adviskv.pb.ReplicaID config_replica_id = 7;
  string request_id = 8;
  string expected = 9;
}
